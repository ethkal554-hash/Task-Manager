<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
        <style>
            body{
                background-color:#f0f2f5 ;
            }
            .complete{
                text-decoration: line-through;
                color: #abd5bd;
            }
            .complete1{
                 background-color:#e5e6e8 ;
            }
        </style>
</head>
<body>
    <header class="text-center p-3 fs-1 fw-bold">
        <span><i class="bi bi-journal-text"></i></span>Task Manager
    </header>
    <section id="search">
        <div class="adding">
            <div class="input-section m-5">
                  <form id="addForm" class="d-flex gap-3 mb-3 p-2"> 
                <input id="task" type="text" class="form-control" placeholder="Enter new task . . ">
                <button class="btn btn-primary" value="submit" type="submit">Add</button>
            </form>
            </div>
        </div>
    </section>
    <section id="buttons">
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center p-3">
            <button class="btn btn-outline-secondary" data-filter="all">All</button>
            <button
            class="btn btn-outline-primary" data-filter="active">Active
            </button>
            <button
            class="btn btn-outline-success" data-filter="complete"> Completed
           </button>
        </div>
    </section>
    <section class="p-5" id="taskList">
        <div class="listTask">
            <ul class="list-group" id="tasks">
                <li class="list-group-item d-flex align-items-center rounded-2 m-1">
                    <div class="form-check">
                        <input class="check form-check-input" type="checkbox"/>
                        <label class="form-check-label" for="flexCheckDefault">
                            Buy groceries
                        </label>
                    </div>
                    <button class=" delete btn btn-outline-danger btn-sm ms-auto">Delete</button>
                </li>
                <li class="list-group-item d-flex align-items-center rounded-2 m-1">
                    <div class="form-check">
                        <input class="check form-check-input" type="checkbox"/>
                        <label class="form-check-label" for="flexCheckDefault">
                            Finish portfolio
                        </label>
                    </div>
                    <button class="delete btn btn-outline-danger btn-sm ms-auto">Delete</button>
                </li>
                <li class="list-group-item d-flex align-items-center rounded-2 m-1">
                    <div class="form-check">
                        <input class="check form-check-input" type="checkbox"/>
                        <label class="form-check-label" for="flexCheckDefault">
                            Master bootstrap
                        </label>
                    </div>
                    <button class="delete btn btn-outline-danger btn-sm ms-auto">Delete</button>
                </li>
                <li class="list-group-item d-flex align-items-center rounded-2 m-1">
                    <div class="form-check">
                        <input class="check form-check-input" type="checkbox"/>
                        <label class="form-check-label" for="flexCheckDefault">
                            Learn JavaScript
                        </label>
                    </div>
                    <button class=" delete btn btn-outline-danger btn-sm ms-auto">Delete</button>
                </li>
            </ul>
        </div>
    </section>
      <div class="counter">
          <h3 id="counter" class="fs-3 fw-bold text-center text-muted">0 tasks remaining</h3>
      </div>


    <footer>
        <p class="text-center text-muted">© 2026 Zeki.M</p>
    </footer>
    <script src="To_Do.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        ntegrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
